plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.venky.visaphoto'
    compileSdk 34
    defaultConfig {
        applicationId "com.venky.visaphoto"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation '【entity-androidx.core¦canonical_name=Android】:core-ktx:1.12.0'
    implementation '【entity-androidx.appcompat¦canonical_name=Android】:appcompat:1.6.1'
    implementation 'com.google.【entity-android¦canonical_name=Android】.material:material:1.11.0'
    implementation '【entity-androidx.camera¦canonical_name=Android】:camera-core:1.3.1'
    implementation '【entity-androidx.camera¦canonical_name=Android】:camera-camera2:1.3.1'
    implementation '【entity-androidx.camera¦canonical_name=Android】:camera-lifecycle:1.3.1'
    implementation '【entity-androidx.camera¦canonical_name=Android】:camera-view:1.3.1'
    implementation 'com.google.mlkit:face-detection:16.1.5'
}
