name: Build Visa Photo App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup 【entity-Android¦canonical_name=Android】 SDK
        uses: 【entity-android¦canonical_name=Android】-actions/setup-【entity-android¦canonical_name=Android】@v3
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visa-photo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
